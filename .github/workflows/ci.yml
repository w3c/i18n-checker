name: CI

# Pushing to `main` or opening a PR against `main` will both trigger this
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      web:
        image: php:8.3-apache
        ports:
          - 80:80
        volumes:
          - ${{ github.workspace }}:/var/www/html
        options: >-
          --health-cmd "curl -fsS http://localhost/www/index.php || exit 1"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install PHP intl extension
        run: |
          docker exec ${{ job.services.web.id }} bash -c '
            apt-get -o Acquire::Retries=3 update &&
            DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends libicu-dev &&
            docker-php-ext-install -j"$(nproc)" intl
          '

      - name: Configure checker
        run: |
          docker exec ${{ job.services.web.id }} bash -c '
            cp conf/i18n.conf.dist conf/i18n.conf &&
            sed -i "s#^test_url=.*#test_url=\"http://localhost/tests/generate.php\"#" conf/i18n.conf &&
            sed -i "s#^log4php.appender.A.File=.*#log4php.appender.A.File=/var/www/html/logs/i18n.log#" conf/log4php.properties &&
            mkdir -p logs && touch logs/i18n.log && chown -R www-data:www-data logs
          '

      - name: Restart Apache
        run: docker exec ${{ job.services.web.id }} apachectl restart

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost/www/index.php > /dev/null 2>&1; then
              echo "Service is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Service did not become ready"
          exit 1

      - name: Run regression tests
        run: docker exec ${{ job.services.web.id }} php /var/www/html/tests/run.php
